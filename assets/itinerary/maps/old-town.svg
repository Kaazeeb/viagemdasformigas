<svg xmlns="http://www.w3.org/2000/svg" width="640" height="952" viewBox="0 0 640 952" role="img" aria-labelledby="title desc">
<title id="title">Shichahai · torres, rua e lagos</title><desc id="desc">Começar ao norte pela Torre do Sino, seguir ao sul para a Torre do Tambor, ambas por fora. Seguir a sudoeste pela rua Yandai Xiejie até a Ponte Yinding entre Houhai e Qianhai. Entrar cerca de 150 a 200 metros no início de Ya’er Hutong, 鸦儿胡同, junto ao lado norte da Ponte Yinding e à margem norte de Houhai; retornar à ponte. Fazer uma caminhada curta pela margem leste de Qianhai. Encerrar junto a Shichahai, linha 8, acesso A2, como referência para encontrar o carro; não pegar metrô nesse trecho. Não precisa contornar os lagos completos.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="952" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Shichahai · torres, rua e lagos</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><path d="M40 288 Q111 248 183 273 Q241 302 258 382 L256 448 Q185 443 128 410 Q72 391 40 372Z" fill="#d5e8e7"/><path d="M245 460 Q338 450 397 514 Q434 587 380 683 Q306 733 197 704 Q174 667 191 596Z" fill="#d5e8e7"/><text x="107" y="341" font-size="20" fill="#176b60" text-anchor="middle" font-weight="600">HOUHAI</text><text x="290" y="599" font-size="20" fill="#176b60" text-anchor="middle" font-weight="600">QIANHAI</text><rect x="332" y="134" width="207" height="68" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="435.5" y="162" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Torre do Sino</text><text x="435.5" y="188" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">钟楼 · exterior</text><path d="M437 205 V244" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><rect x="332" y="250" width="207" height="70" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="435.5" y="278" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Torre do Tambor</text><text x="435.5" y="304" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">鼓楼 · exterior</text><path d="M436 325 L399 372 L290 431" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="415" y="394" font-size="18" fill="#176b60" text-anchor="start" font-weight="400">Yandai Xiejie</text><text x="430" y="419" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">烟袋斜街</text><rect x="235" y="438" width="49" height="25" rx="4" fill="#efe0ba" stroke="#b9aa87"/><text x="403" y="468" font-size="20" fill="#253d35" text-anchor="start" font-weight="600">Ponte Yinding</text><text x="429" y="494" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">银锭桥</text><path d="M268 435 L282 400 L277 348 Q271 298 215 265" fill="none" stroke="#bc5036" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#red)"/><text x="31" y="216" font-size="18" fill="#bc5036" text-anchor="start" font-weight="600">Ya’er Hutong · 鸦儿胡同</text><text x="31" y="242" font-size="18" fill="#bc5036" text-anchor="start" font-weight="400">150–200 m + retorno à ponte</text><path d="M287 457 L393 511 Q451 580 423 650 L472 710 V746" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="455" y="579" font-size="18" fill="#176b60" text-anchor="start" font-weight="400">Margem</text><text x="455" y="604" font-size="18" fill="#176b60" text-anchor="start" font-weight="400">de Qianhai</text><rect x="365" y="746" width="243" height="86" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="486.5" y="770" font-size="19" fill="#bc5036" text-anchor="middle" font-weight="600">Shichahai · 什刹海</text><text x="486.5" y="795" font-size="19" fill="#bc5036" text-anchor="middle" font-weight="600">Referência do carro</text><text x="486.5" y="820" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="400">Linha 8 · acesso A2</text><text x="40" y="795" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Não é preciso dar a</text><text x="40" y="819" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">volta completa nos lagos.</text>
<path d="M28 845 H612" stroke="#cfdbcb"/><path d="M30 868 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="875" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="907" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Vermelho: Ya’er Hutong, junto ao norte da ponte.</text><text x="28" y="931" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Verde: passeio até o ponto de referência do carro.</text></g></svg>