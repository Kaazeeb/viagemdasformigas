<svg xmlns="http://www.w3.org/2000/svg" width="640" height="896" viewBox="0 0 640 896" role="img" aria-labelledby="title desc">
<title id="title">Palácio de Verão · circuito do lago</title><desc id="desc">Entrar e sair pelo Portão Leste, Donggongmen. Ver o pátio externo de Renshou, seguir para Leshoutang, junto ao lago, e entrar no Longo Corredor para oeste até a região do Portão Paiyun. Retornar pelo mesmo setor junto ao lago até o Portão Leste, onde se reencontra o motorista. Não inclui subida da Colina da Longevidade nem Barco de Mármore.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="896" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Palácio de Verão · circuito do lago</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><rect x="40" y="112" width="521" height="183" rx="14" fill="#e5eee1" stroke="#cfdbcb"/><text x="57" y="144" font-size="18" fill="#5e7168" text-anchor="start" font-weight="700">COLINA DA LONGEVIDADE</text><text x="58" y="173" font-size="17" fill="#5e7168" text-anchor="start" font-weight="400">Setores em subida ficam fora do percurso.</text><path d="M38 395 Q146 372 226 426 Q290 450 350 465 L365 600 L346 744 L38 744Z" fill="#d5e8e7"/><text x="223" y="676" font-size="22" fill="#176b60" text-anchor="middle" font-weight="600">LAGO KUNMING</text><path d="M504 477 V414 L449 375 L359 338 H122" fill="none" stroke="#176b60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><path d="M122 370 L239 410 L362 433 L457 414 H580" fill="none" stroke="#bc5036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#red)"/><rect x="54" y="219" width="215" height="73" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="161.5" y="247" font-size="19" fill="#253d35" text-anchor="middle" font-weight="400">Portão Paiyun</text><text x="161.5" y="273" font-size="19" fill="#253d35" text-anchor="middle" font-weight="400">排云门 · exterior</text><path d="M122 337 V295" fill="none" stroke="#176b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="66" y="319" width="291" height="41" rx="7" fill="#dddfc4" stroke="#bcc7a9"/><path d="M350 340 H81" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="182" y="311" font-size="18" fill="#176b60" text-anchor="middle" font-weight="400">Longo Corredor · 长廊</text><rect x="304" y="211" width="195" height="80" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="401.5" y="239" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Leshoutang</text><text x="401.5" y="265" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">pátio / beira-lago</text><path d="M359 334 V295" fill="none" stroke="#176b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="395" y="477" width="208" height="84" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="499.0" y="505" font-size="19" fill="#253d35" text-anchor="middle" font-weight="400">Renshou</text><text x="499.0" y="531" font-size="19" fill="#253d35" text-anchor="middle" font-weight="400">pátio externo</text><path d="M457 433 V477" fill="none" stroke="#bc5036" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="403" y="593" width="201" height="85" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="503.5" y="621" font-size="19" fill="#bc5036" text-anchor="middle" font-weight="600">Portão Leste</text><text x="503.5" y="647" font-size="19" fill="#bc5036" text-anchor="middle" font-weight="600">东宫门</text><text x="503.5" y="673" font-size="19" fill="#bc5036" text-anchor="middle" font-weight="600">entrada + saída</text><path d="M504 593 V563" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><path d="M580 414 V589" fill="none" stroke="#bc5036" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#red)"/><text x="328" y="751" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="400">Retorno junto ao lago → mesmo portão</text>
<path d="M28 789 H612" stroke="#cfdbcb"/><path d="M30 812 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="819" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="851" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Verde: ida pelo corredor; vermelho: retorno pelo lago.</text><text x="28" y="875" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Reencontro com motorista pelo Portão Leste.</text></g></svg>