<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1057" viewBox="0 0 640 1057" role="img" aria-labelledby="title desc">
<title id="title">Tian’anmen → Qianmen / Dashilar</title><desc id="desc">Após o acesso autorizado à Praça Tiananmen, caminhar para o sul observando o Monumento aos Heróis do Povo e o exterior do Mausoléu de Mao. Usar saída sul e passagem autorizada para a região de Zhengyangmen. Seguir ao sul pela rua Qianmen e entrar à direita, para oeste, em Dashilar. Retorno de carro a partir de via aberta ao trânsito, fora das ruas de pedestres.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="1057" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Tian’anmen → Qianmen / Dashilar</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><rect x="174" y="122" width="292" height="72" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="320.0" y="150" font-size="19" fill="#253d35" text-anchor="middle" font-weight="400">Portão Tian’anmen</text><text x="320.0" y="176" font-size="19" fill="#253d35" text-anchor="middle" font-weight="400">vista a partir da praça</text><rect x="121" y="249" width="405" height="315" rx="14" fill="#e5eee1" stroke="#cfdbcb"/><text x="145" y="280" font-size="19" fill="#5e7168" text-anchor="start" font-weight="700">PRAÇA TIAN’ANMEN</text><path d="M457 300 H323 V426 V549 V623 V735 V842" fill="none" stroke="#176b60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><rect x="424" y="202" width="183" height="94" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="515.5" y="230" font-size="17" fill="#bc5036" text-anchor="middle" font-weight="600">Acesso à praça</text><text x="515.5" y="256" font-size="17" fill="#bc5036" text-anchor="middle" font-weight="600">reserva + controle</text><text x="515.5" y="282" font-size="17" fill="#bc5036" text-anchor="middle" font-weight="600">seguir sinalização</text><rect x="192" y="332" width="263" height="81" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="323.5" y="360" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Monumento aos</text><text x="323.5" y="386" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Heróis do Povo</text><rect x="185" y="460" width="277" height="69" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="323.5" y="488" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Mausoléu de Mao</text><text x="323.5" y="514" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">somente exterior</text><rect x="103" y="583" width="453" height="25" rx="4" fill="#eee8db" stroke="#eee8db"/><text x="48" y="636" font-size="17" fill="#5e7168" text-anchor="start" font-weight="400">Saída pelo lado sul / passagem autorizada</text><rect x="194" y="654" width="264" height="64" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="326.0" y="682" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Zhengyangmen · 正阳门</text><rect x="282" y="737" width="83" height="156" rx="9" fill="#efe7d6" stroke="#d8cbb4"/><text x="389" y="797" font-size="20" fill="#253d35" text-anchor="start" font-weight="600">Rua Qianmen</text><text x="389" y="823" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">前门大街</text><rect x="47" y="821" width="235" height="59" rx="9" fill="#efe7d6" stroke="#d8cbb4"/><path d="M314 850 H90" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="142" y="813" font-size="19" fill="#253d35" text-anchor="middle" font-weight="600">Dashilar · 大栅栏</text><path d="M83 879 V925" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="119" y="927" font-size="17" fill="#5e7168" text-anchor="start" font-weight="400">Rua com acesso para buscar carro</text>
<path d="M28 950 H612" stroke="#cfdbcb"/><path d="M30 973 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="980" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="1012" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Controles podem alterar o acesso e a saída da praça.</text><text x="28" y="1036" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Carro: combinar coleta fora das ruas de pedestres.</text></g></svg>