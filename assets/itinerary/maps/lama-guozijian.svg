<svg xmlns="http://www.w3.org/2000/svg" width="640" height="882" viewBox="0 0 640 882" role="img" aria-labelledby="title desc">
<title id="title">Templo Lama + Guozijian</title><desc id="desc">Entrar no Templo Lama pelo portão principal ao sul. Percorrer o eixo de salões em direção ao norte, até o pavilhão Wanfuge, e retornar ao mesmo portão. Caminhar para sudoeste até a rua Guozijian; Templo de Confúcio e Academia Imperial apenas por fora. Norte para cima.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="882" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Templo Lama + Guozijian</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><rect x="304" y="129" width="247" height="463" rx="14" fill="#e5eee1" stroke="#cfdbcb"/><text x="322" y="161" font-size="19" fill="#5e7168" text-anchor="start" font-weight="700">TEMPLO LAMA</text><path d="M410 562 V448 V338 V221" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><path d="M508 221 V558" fill="none" stroke="#bc5036" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#red)"/><rect x="329" y="180" width="186" height="66" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="422.0" y="208" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Pavilhão Wanfuge</text><text x="422.0" y="234" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">grande Buda</text><rect x="329" y="298" width="151" height="67" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="404.5" y="326" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Salão Falun</text><text x="404.5" y="352" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">法轮殿</text><rect x="329" y="410" width="151" height="67" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="404.5" y="438" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Salões centrais</text><text x="404.5" y="464" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">+ pátios</text><rect x="317" y="545" width="219" height="75" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="426.5" y="573" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="600">Portão principal sul</text><text x="426.5" y="599" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="600">Entrada + saída</text><text x="510" y="377" font-size="24" fill="#bc5036" text-anchor="middle" font-weight="400">↓</text><path d="M408 623 V674 H129" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><rect x="45" y="649" width="410" height="68" rx="10" fill="#efe7d6" stroke="#d8cbb4"/><path d="M413 682 H105" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="243" y="674" font-size="20" fill="#253d35" text-anchor="middle" font-weight="600">Rua Guozijian · 国子监街</text><rect x="50" y="543" width="224" height="76" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="162" y="571" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="400">Confúcio / Academia</text><text x="162" y="597" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="400">somente fachadas</text><path d="M154 645 V622" fill="none" stroke="#176b60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="751" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Guozijian fica a sudoeste do portão principal.</text>
<path d="M28 775 H612" stroke="#cfdbcb"/><path d="M30 798 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="805" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="837" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Lama: percurso de ida e volta pelo eixo central.</text><text x="28" y="861" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Guozijian: passeio pela rua, sem visitas aos interiores.</text></g></svg>