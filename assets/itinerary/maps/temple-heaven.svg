<svg xmlns="http://www.w3.org/2000/svg" width="640" height="910" viewBox="0 0 640 910" role="img" aria-labelledby="title desc">
<title id="title">Templo do Céu · sul → leste</title><desc id="desc">Entrar pelo portão sul. Seguir Altar Circular, Abóbada Imperial e Muro do Eco, Caminho Danbi e Sala de Oração pelas Boas Colheitas. Sair pelo Longo Corredor e portão leste, perto do metrô Tiantandongmen, linha 5. Norte para cima.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="910" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Templo do Céu · sul → leste</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><rect x="38" y="113" width="466" height="630" rx="14" fill="#e5eee1" stroke="#cfdbcb"/><text x="58" y="142" font-size="18" fill="#5e7168" text-anchor="start" font-weight="700">PARQUE DO TEMPLO DO CÉU</text><path d="M238 700 V604 V496 V385 V229 H390 L462 302 H550" fill="none" stroke="#176b60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><rect x="83" y="654" width="310" height="61" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="238.0" y="682" font-size="20" fill="#bc5036" text-anchor="middle" font-weight="600">Entrada sul · 南门</text><circle cx="69" cy="685" r="17" fill="#176b60"/><text x="69" y="692" font-size="20" fill="white" text-anchor="middle" font-weight="700">1</text><rect x="110" y="551" width="255" height="66" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="237.5" y="579" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Altar Circular</text><text x="237.5" y="605" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">圜丘</text><circle cx="94" cy="584" r="17" fill="#176b60"/><text x="94" y="591" font-size="20" fill="white" text-anchor="middle" font-weight="700">2</text><rect x="95" y="435" width="285" height="79" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="237.5" y="463" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Abóbada Imperial</text><text x="237.5" y="489" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">+ Muro do Eco</text><circle cx="79" cy="474" r="17" fill="#176b60"/><text x="79" y="481" font-size="20" fill="white" text-anchor="middle" font-weight="700">3</text><text x="53" y="369" font-size="18" fill="#176b60" text-anchor="start" font-weight="400">Caminho Danbi</text><text x="53" y="393" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">eixo sul → norte</text><rect x="92" y="176" width="287" height="77" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="235.5" y="204" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Sala de Oração</text><text x="235.5" y="230" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">pelas Boas Colheitas</text><circle cx="76" cy="213" r="17" fill="#176b60"/><text x="76" y="220" font-size="20" fill="white" text-anchor="middle" font-weight="700">4</text><rect x="337" y="269" width="180" height="63" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="427.0" y="297" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Longo Corredor</text><rect x="329" y="351" width="273" height="77" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="465.5" y="379" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="600">Saída leste · 东门</text><text x="465.5" y="405" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="600">→ Tiantandongmen, L5</text><path d="M514 310 V350" fill="none" stroke="#bc5036" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><text x="58" y="778" font-size="19" fill="#253d35" text-anchor="start" font-weight="600">Entrada e saída em lados diferentes.</text>
<path d="M28 803 H612" stroke="#cfdbcb"/><path d="M30 826 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="833" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="865" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Os monumentos exigem ingresso combinado.</text><text x="28" y="889" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">O trajeto cruza o parque; não retorna ao portão sul.</text></g></svg>