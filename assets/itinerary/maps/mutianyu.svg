<svg xmlns="http://www.w3.org/2000/svg" width="640" height="986" viewBox="0 0 640 986" role="img" aria-labelledby="title desc">
<title id="title">Mutianyu · acessos à muralha</title><desc id="desc">Centro de visitantes ao sul. Ônibus interno até a região dos acessos. A cabine fechada dá acesso à torre 14. A cadeirinha aberta e o tobogã atendem a torre 6. Trilhas a pé com escadas dão acesso à muralha perto das torres 6, 8 e 10. As torres 6 e 14 se conectam por caminhada na muralha, não por transfer de teleférico. Equipamento de subida e descida ainda a confirmar.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="986" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Mutianyu · acessos à muralha</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><path d="M78 246 L174 223 L274 249 L362 237 L486 278 L559 268" fill="none" stroke="#9eaa95" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="180" font-size="18" fill="#5e7168" text-anchor="start" font-weight="700">MURALHA</text><rect x="70" y="225" width="40" height="38" rx="5" fill="#fffdf6" stroke="#176b60"/><text x="90" y="251" font-size="20" fill="#253d35" text-anchor="middle" font-weight="700">20</text><rect x="247" y="229" width="40" height="38" rx="5" fill="#fffdf6" stroke="#176b60"/><text x="267" y="255" font-size="20" fill="#253d35" text-anchor="middle" font-weight="700">14</text><rect x="346" y="220" width="40" height="38" rx="5" fill="#fffdf6" stroke="#176b60"/><text x="366" y="246" font-size="20" fill="#253d35" text-anchor="middle" font-weight="700">10</text><rect x="405" y="239" width="40" height="38" rx="5" fill="#fffdf6" stroke="#176b60"/><text x="425" y="265" font-size="20" fill="#253d35" text-anchor="middle" font-weight="700">8</text><rect x="481" y="256" width="40" height="38" rx="5" fill="#fffdf6" stroke="#176b60"/><text x="501" y="282" font-size="20" fill="#253d35" text-anchor="middle" font-weight="700">6</text><text x="84" y="305" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Trecho oeste</text><text x="267" y="330" font-size="18" fill="#176b60" text-anchor="middle" font-weight="400">Torre 14</text><text x="518" y="330" font-size="18" fill="#176b60" text-anchor="middle" font-weight="400">Torre 6</text><path d="M256 589 V352" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><path d="M489 589 V354" fill="none" stroke="#bc5036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><rect x="125" y="381" width="188" height="83" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="219.0" y="409" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Cabine fechada</text><text x="219.0" y="435" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">sobe e desce</text><text x="219.0" y="461" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">→ torre 14</text><rect x="377" y="379" width="218" height="111" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="486.0" y="407" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Cadeirinha aberta ↑</text><text x="486.0" y="433" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Tobogã ↓</text><text x="486.0" y="459" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">mesma região</text><text x="486.0" y="485" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">→ torre 6</text><path d="M324 589 Q358 449 365 282" fill="none" stroke="#5e7168" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="39" y="532" font-size="19" fill="#5e7168" text-anchor="start" font-weight="400">Trilhas com escadas</text><text x="39" y="558" font-size="17" fill="#5e7168" text-anchor="start" font-weight="400">acessos às torres 6 / 8 / 10</text><rect x="188" y="589" width="287" height="65" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="331.5" y="617" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Área dos acessos de subida</text><path d="M329 724 V657" fill="none" stroke="#176b60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="356" y="700" font-size="18" fill="#176b60" text-anchor="start" font-weight="400">Ônibus interno</text><rect x="176" y="735" width="310" height="72" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="331.0" y="763" font-size="20" fill="#bc5036" text-anchor="middle" font-weight="600">Centro de visitantes</text><text x="331.0" y="789" font-size="20" fill="#bc5036" text-anchor="middle" font-weight="600">游客中心</text><text x="34" y="851" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">As duas estações de subida ficam separadas.</text>
<path d="M28 879 H612" stroke="#cfdbcb"/><path d="M30 902 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="909" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="941" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">6 → 14: ligação a pé sobre a muralha, com escadas.</text><text x="28" y="965" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Equipamentos de subida/descida: decisão pendente.</text></g></svg>