<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070" role="img" aria-labelledby="title desc">
<title id="title">Cidade Proibida → Jingshan</title><desc id="desc">Chegada do carro junto à região de Donghuamen, fora do palácio. Contornar por fora, ao longo do fosso, para o sul até Wumen, a entrada de visitantes. Percorrer o eixo central ao norte: pontes Água Dourada, três Salões da Harmonia, palácios internos e Jardim Imperial. Sair por Shenwumen; usar a travessia sinalizada para a entrada sul de Jingshan e subir ao mirante. Não há reentrada no palácio.</desc>
<defs><marker id="jade" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#176b60"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#bc5036"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><rect width="640" height="1070" rx="20" fill="#fbf8ef"/><text x="28" y="40" font-size="24" fill="#253d35" text-anchor="start" font-weight="700">Cidade Proibida → Jingshan</text><text x="28" y="69" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Esquema · sem escala</text><text x="596" y="96" font-size="18" fill="#5e7168" text-anchor="middle" font-weight="700">N</text><path d="M596 146 V116" fill="none" stroke="#5e7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 124 L596 116 L602 124" fill="none" stroke="#5e7168" stroke-width="2"/><rect x="52" y="112" width="431" height="186" rx="14" fill="#e5eee1" stroke="#cfdbcb"/><text x="73" y="141" font-size="18" fill="#5e7168" text-anchor="start" font-weight="700">PARQUE JINGSHAN</text><path d="M175 216 Q264 105 353 216Z" fill="#e5eee1" stroke="#cfdbcb"/><path d="M248 282 V182" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><path d="M288 184 V281" fill="none" stroke="#bc5036" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#red)"/><text x="266" y="173" font-size="20" fill="#253d35" text-anchor="middle" font-weight="600">Mirante</text><rect x="155" y="241" width="234" height="59" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="272.0" y="269" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="600">Portão sul · 南门</text><rect x="42" y="311" width="512" height="29" rx="4" fill="#eee8db" stroke="#eee8db"/><text x="324" y="332" font-size="17" fill="#5e7168" text-anchor="start" font-weight="400">Travessia sinalizada</text><rect x="75" y="355" width="398" height="498" rx="14" fill="#e5eee1" stroke="#cfdbcb"/><text x="87" y="386" font-size="18" fill="#5e7168" text-anchor="start" font-weight="700">CIDADE PROIBIDA</text><path d="M267 858 V775 V694 V599 V504 V406 V346 V303" fill="none" stroke="#176b60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><rect x="142" y="361" width="254" height="63" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="269.0" y="389" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="600">Saída Shenwumen · 神武门</text><rect x="148" y="469" width="242" height="60" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="269.0" y="497" font-size="20" fill="#253d35" text-anchor="middle" font-weight="400">Jardim Imperial</text><rect x="136" y="567" width="266" height="74" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="269.0" y="595" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Eixo dos palácios internos</text><text x="269.0" y="621" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">seguir em direção norte</text><rect x="137" y="669" width="261" height="60" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="267.5" y="697" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Três Salões da Harmonia</text><rect x="163" y="757" width="210" height="61" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="268.0" y="785" font-size="18" fill="#253d35" text-anchor="middle" font-weight="400">Pontes Água Dourada</text><rect x="150" y="831" width="237" height="62" rx="14" fill="#fffdf6" stroke="#bc5036"/><text x="268.5" y="859" font-size="20" fill="#bc5036" text-anchor="middle" font-weight="600">Entrada Wumen · 午门</text><path d="M537 552 V918 H268 V896" fill="none" stroke="#bc5036" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><rect x="458" y="443" width="158" height="100" rx="14" fill="#fffdf6" stroke="#cfdbcb"/><text x="537.0" y="471" font-size="17" fill="#253d35" text-anchor="middle" font-weight="400">Donghuamen</text><text x="537.0" y="497" font-size="17" fill="#253d35" text-anchor="middle" font-weight="400">东华门</text><text x="537.0" y="523" font-size="17" fill="#253d35" text-anchor="middle" font-weight="400">ponto de chegada</text><text x="552" y="738" font-size="26" fill="#bc5036" text-anchor="middle" font-weight="400">↓</text><text x="430" y="947" font-size="18" fill="#bc5036" text-anchor="middle" font-weight="400">Acesso externo pelo fosso</text>
<path d="M28 963 H612" stroke="#cfdbcb"/><path d="M30 986 H65" fill="none" stroke="#176b60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jade)"/><text x="77" y="993" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Percurso sugerido</text><text x="28" y="1025" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Vermelho: aproximação externa; verde: visita.</text><text x="28" y="1049" font-size="18" fill="#5e7168" text-anchor="start" font-weight="400">Após Shenwumen, sair do palácio é definitivo.</text></g></svg>